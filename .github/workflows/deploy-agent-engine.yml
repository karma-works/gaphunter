name: Deploy Agent Engine

on:
  workflow_dispatch:
    inputs:
      display_name:
        description: Agent Engine display name
        required: false
        default: gaphunter-agent-engine

permissions:
  contents: read
  id-token: write

jobs:
  deploy-agent-engine:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - id: deploy
        name: Deploy Agent Engine
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |-
          set -o pipefail
          python agent/deploy.py \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --location us-central1 \
            --display-name "${{ inputs.display_name }}" \
            --brave-search-api-key "$BRAVE_SEARCH_API_KEY" \
            --gemini-api-key "$GEMINI_API_KEY" \
            2>&1 | tee /tmp/agent-engine-deploy.log
          resource_name="$(
            grep -E '^projects/[0-9]+/locations/[^/]+/reasoningEngines/[0-9]+$' \
              /tmp/agent-engine-deploy.log \
              | tail -n 1
          )"
          test -n "$resource_name"
          echo "resource_name=${resource_name}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${resource_name}"

      - name: Show next command
        run: |-
          echo "Run locally:"
          echo "gh variable set AGENT_ENGINE_RESOURCE_NAME --body '${{ steps.deploy.outputs.resource_name }}'"
