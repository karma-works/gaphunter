[project]
name = "gaphunter"
version = "0.1.0"
description = "AI-assisted market gap research for founder idea generation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Christian Haegele", email = "christian@haegele.dev" }
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "google-cloud-firestore>=2.16.0",
  "google-cloud-aiplatform[agent_engines]>=1.112.0",
  "google-genai>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"
